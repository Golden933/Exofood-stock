name: Sauvegarde ExoFood

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TRIGGER_TOKEN }}
        run: |
          test -n "$BACKUP_URL" || { echo "URL non configurée"; exit 1; }
          test -n "$BACKUP_TOKEN" || { echo "Token non configuré"; exit 1; }

      - name: Déclencher la sauvegarde
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TRIGGER_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --connect-timeout 10 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$BACKUP_URL"
